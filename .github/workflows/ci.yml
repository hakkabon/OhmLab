name: release-hardening

on: [push, pull_request]

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift package resolve
      - run: swift test
      - run: ./scripts/health-check.sh

  artifact:
    runs-on: macos-14
    needs: [swift]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/package-release.sh "$RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: OhmLab-macOS
          path: |
            ${{ runner.temp }}/artifacts/*.zip
            ${{ runner.temp }}/artifacts/*.sha256
          if-no-files-found: error
