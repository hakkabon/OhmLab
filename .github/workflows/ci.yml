name: release-hardening

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust-host:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path rust/ohmlab-rust-host/Cargo.toml
      - run: cargo build --locked --manifest-path rust/ohmlab-rust-host/Cargo.toml
      - run: rust/ohmlab-rust-host/target/debug/ohmlab-rust-host qualify
      - uses: actions/upload-artifact@v4
        with:
          name: ohmlab-rust-host-${{ matrix.os }}
          path: rust/ohmlab-rust-host/target/debug/ohmlab-rust-host
          if-no-files-found: error

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift package resolve
      - run: swift test
      - run: ./scripts/health-check.sh

  ipados:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift package resolve
      # The pinned NumericCore XCFramework ships arm64 iOS and arm64
      # iOS-simulator slices only, so restrict the generic build to arm64
      # instead of asking for a universal simulator binary.
      - run: >
          xcodebuild
          -scheme OhmLab
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ohmlab-derived-data"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          build

  artifact:
    runs-on: macos-14
    needs: [swift, rust-host]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/package-release.sh "$RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: OhmLab-macOS
          path: |
            ${{ runner.temp }}/artifacts/*.zip
            ${{ runner.temp }}/artifacts/*.sha256
          if-no-files-found: error
