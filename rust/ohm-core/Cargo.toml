[package]
name = "ohm-core"
version = "0.3.0"
edition = "2021"
description = "OhmLab's optional Rust MNA DC/AC/transient engine with a versioned Circuit IR JSON C ABI."
license = "MIT"

[lib]
name = "ohm_core"
# staticlib/cdylib are what the SwiftPM systemLibrary target links against;
# rlib keeps the crate usable from other Rust crates and `cargo test`.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
